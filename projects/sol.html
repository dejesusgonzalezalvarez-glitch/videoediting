<!DOCTYPE html>
<html lang="es">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Solar - Sol</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="threejs-canvas"></canvas>
  
  <script type="module">
    
    
    import * as THREE from '../../../node_modules/three/build/three.module.js';
// Escena, cámara, renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a20);
    
    const camera = new THREE.PerspectiveCamera(50, 1920/1080, 0.1, 1000);
    camera.position.set(0, 2, 8);
    
    const renderer = new THREE.WebGLRenderer({ 
      canvas: document.querySelector('#threejs-canvas'), 
      antialias: true 
    });
    renderer.setSize(1920, 1080);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    // Luz ambiental
    const ambientLight = new THREE.AmbientLight(0x2d1b00, 0.6);
    scene.add(ambientLight);
    
    // Luz direccional (simulando luz solar direccional)
    const dirLight = new THREE.DirectionalLight(0xfff0b0, 1.2);
    dirLight.position.set(10, 8, 7);
    scene.add(dirLight);
    
    // LUZ PUNTUAL para resaltar partes del Sol
    const pointLight = new THREE.PointLight(0xffa500, 0.5, 15);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);
    
    // ===== SOL PRINCIPAL =====
    // Geometría con más detalle para simular superficie solar
    const solGeometry = new THREE.SphereGeometry(3, 128, 128);
    
    // Custom shader material para simular superficie solar giratoria
    const solMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor1: { value: new THREE.Color(0xff4500) }, // naranja profundo
        uColor2: { value: new THREE.Color(0xff8c00) }, // naranja claro
        uColor3: { value: new THREE.Color(0xffd700) }  // dorado
      },
      vertexShader: `
        varying vec2 vUv;
        varying float vProgress;
        void main() {
          vUv = uv;
          vProgress = position.y * 0.5 + 0.5;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        
        varying vec2 vUv;
        varying float vProgress;
        
        void main() {
          // Base con gradiente de color
          vec3 col1 = uColor1;
          vec3 col2 = uColor2;
          vec3 col3 = uColor3;
          
          // Simular bandas solares rotativas
          float band = sin(uTime * 0.5 + vProgress * 6.28) * 0.5 + 0.5;
          vec3 mixed = mix(col1, col2, band);
          
          // Puntos brillantes simulando llamaradas
          float brightness = 1.0;
          for (int i = 0; i < 4; i++) {
            vec2 spot = vUv - vec2(0.5);
            float dist = length(spot);
            float spotIntensity = pow(1.0 - dist * dist, 3.0);
            brightness += spotIntensity * 0.15 * (i + 1.0);
          }
          
          vec3 finalColor = mixed * brightness;
          
          // Borde más brillante
          float edge = 1.0 - length(vUv - 0.5);
          if (edge > 0.7) {
            finalColor = mix(finalColor, col3, (edge - 0.7) * 3.0);
          }
          
          gl_FragColor = vec4(finalColor, 1.0);
        `
    });
    
    const sol = new THREE.Mesh(solGeometry, solMaterial);
    sol.position.set(0, 0, 0);
    scene.add(sol);
    
    // ===== FLECHAS DE MASA =====
    // Flechas que indican la enorme masa del Sol
    const arrowHeadSize = 0.5;
    
    // Flecha hacia derecha (indicando "1 millón de Tierras")
    const arrow1Length = 4;
    const arrow1 = new THREE.ArrowHelper(
      new THREE.Vector3(1, 0, 0), // dirección X positiva
      new THREE.Vector3(0, 0, 0), // origen en el centro
      arrowHeadSize * 8, // longitud
      0xff0000, // color rojo
      arrowHeadSize, // tamaño de la cabeza
      arrowHeadSize
    );
    arrow1.position.x = -2; // un poco antes del centro
    scene.add(arrow1);
    
    // Etiqueta flotante "1 MILLION EARTHS"
    const labelGeometry = new THREE.PlaneGeometry(3, 0.8);
    const labelMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.9,
      side: THREE.DoubleSide
    });
    // Usaremos un texto simple como mapa - para simplificar, un rectángulo blanco
    const label = new THREE.Mesh(labelGeometry, labelMaterial);
    label.position.set(5, 3, 0);
    label.rotation.x = -Math.PI / 2;
    scene.add(label);
    
    // Más flechas indicando masa
    const arrow2 = new THREE.ArrowHelper(
      new THREE.Vector3(0, 1, 0),
      new THREE.Vector3(0, 0, 0),
      arrowHeadSize * 6,
      0xffa500,
      arrowHeadSize,
      arrowHeadSize
    );
    arrow2.position.y = 2;
    scene.add(arrow2);
    
    // ===== PLANETAS EN ÓRBITA (Pequeños alrededor del Sol) =====
    // Representación visual de "Tierras dentro del Sol"
    const earthOrbitGeometry = new THREE.TorusGeometry(4.5, 0.1, 8, 64);
    const earthOrbitMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.3
    });
    const earthOrbit = new THREE.Mesh(earthOrbitGeometry, earthOrbitMaterial);
    earthOrbit.rotation.x = Math.PI / 2;
    scene.add(earthOrbit);
    
    // 4 planetas terrestres pequeños orbitando (representación conceptual)
    const planetPositions = [
      new THREE.Vector3(3.5, 0.5, 0),
      new THREE.Vector3(3, 1, 0.5),
      new THREE.Vector3(4, -0.5, -0.3),
      new THREE.Vector3(3.2, -1, 0.2)
    ];
    
    const planetGeometries = [];
    const planetMaterials = [];
    const planets = [];
    
    // Colores para los 4 planetas terrestres
    const planetColors = [0x8b4513, 0xa0522d, 0xcd853f, 0xbc8f8f];
    const planetNames = ["MERCURY", "VENUS", "EARTH", "MARS"];
    
    for (let i = 0; i < 4; i++) {
      const pg = new THREE.SphereGeometry(0.3, 16, 16);
      const pm = new THREE.MeshStandardMaterial({ 
        color: planetColors[i],
        roughness: 0.8,
        metalness: 0.1
      });
      const p = new THREE.Mesh(pg, pm);
      p.position.copy(planetPositions[i]);
      // Rotación lenta
      p.userData.speed = 0.01 + Math.random() * 0.01;
      scene.add(p);
      planets.push(p);
    }
    
    // ===== ANIMATION: Rotación del Sol =====
    let solProgress = 0;
    
    window.updateScene = function(timeInSeconds) {
      // Actualizar tiempo uniform en shader
      solMaterial.uniforms.uTime.value = timeInSeconds;
      
      // Rotación del Sol
      sol.rotation.y += 0.005;
      sol.rotation.x += 0.002;
      
      // Rotar planetas terrestres
      for (let i = 0; i < planets.length; i++) {
        planets[i].rotation.y += planets[i].userData.speed;
        planets[i].position.x += Math.sin(timeInSeconds * 0.1) * 0.01;
      }
      
      // Flechas pulsantes leves
      arrow1.setLength(arrowHeadSize * 8 * (0.8 + 0.2 * Math.sin(timeInSeconds * 0.5)));
      arrow2.setLength(arrowHeadSize * 6 * (0.8 + 0.2 * Math.sin(timeInSeconds * 0.5 + 1)));
      
      // Progresso general
      const progress = timeInSeconds / 90;
      
      // En el bloque 3-12s, mostramos la información de masa
      // Pero llevamos la cuenta global
      return {
        globalTime: timeInSeconds,
        active: true,
        scene: "sol",
        localTime: timeInSeconds % 12,
        progress: progress
      };
    };
    
    // Loop de animación
    let solFrame = 0;
    function animate() {
      requestAnimationFrame(animate);
      
      const sceneState = window.updateScene(solFrame);
      
      renderer.render(scene, camera);
      
      solFrame = (solFrame + 1) % 2700;
    }
    animate();
  </script>
</body>
</html>
