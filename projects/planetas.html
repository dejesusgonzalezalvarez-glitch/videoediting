<!DOCTYPE html>
<html lang="es">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Solar - Planetas Terrestres</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="threejs-canvas"></canvas>
  
  <script type="module">
    
    
    import * as THREE from '../../../node_modules/three/build/three.module.js';
// Escena, cámara, renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050515);
    
    const camera = new THREE.PerspectiveCamera(50, 1920/1080, 0.1, 1000);
    camera.position.set(0, 2, 15);
    
    const renderer = new THREE.WebGLRenderer({ 
      canvas: document.querySelector('#threejs-canvas'), 
      antialias: true 
    });
    renderer.setSize(1920, 1080);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    // Luz ambiental fría para espacio
    const ambientLight = new THREE.AmbientLight(0x0d0d20, 0.5);
    scene.add(ambientLight);
    
    // Luz direccional suave
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(10, 10, 8);
    scene.add(dirLight);
    
    // ===== LÍNEA DE ÓRBITAS =====
    // Órbita principal para los planetas terrestres
    const orbitGeometry = new THREE.TorusGeometry(7, 0.15, 8, 64);
    const orbitMaterial = new THREE.MeshBasicMaterial({
      color: 0x444466,
      transparent: true,
      opacity: 0.4
    });
    const orbit = new THREE.Mesh(orbitGeometry, orbitMaterial);
    orbit.rotation.x = Math.PI / 2;
    scene.add(orbit);
    
    // Menor órbita interna
    const innerOrbitGeometry = new THREE.TorusGeometry(4.5, 0.1, 8, 64);
    const innerOrbitMaterial = new THREE.MeshBasicMaterial({
      color: 0x555577,
      transparent: true,
      opacity: 0.3
    });
    const innerOrbit = new THREE.Mesh(innerOrbitGeometry, innerOrbitMaterial);
    innerOrbit.rotation.x = Math.PI / 2;
    scene.add(innerOrbit);
    
    // ===== LOS 4 PLANETAS TERRESTRES =====
    const planetData = [
      { name: "MERCURY", distance: 4.5, size: 0.2, color: 0x8b5a2b, speed: 0.03 },
      { name: "VENUS", distance: 5.5, size: 0.45, color: 0xffd700, speed: 0.02 },
      { name: "EARTH", distance: 6.5, size: 0.5, color: 0x4682b4, speed: 0.015 },
      { name: "MARS", distance: 7.5, size: 0.35, color: 0xb22222, speed: 0.025 }
    ];
    
    const planets = [];
    
    for (let i = 0; i < planetData.length; i++) {
      const p = planetData[i];
      
      // Geometría del planeta
      const geo = new THREE.SphereGeometry(p.size, 32, 32);
      
      // Material con mapa de color simple (usamos color sólido por simplicidad)
      const mat = new THREE.MeshStandardMaterial({ 
        color: p.color,
        roughness: 0.7,
        metalness: 0.05
      });
      
      const planet = new THREE.Mesh(geo, mat);
      
      // Posicionar en órbita usando ángulo creciente
      const angle = (i / planetData.length) * Math.PI * 2 + Math.PI / 2;
      const x = Math.cos(angle) * p.distance;
      const z = Math.sin(angle) * p.distance;
      planet.position.set(x, 0, z);
      
      // Rotación lenta
      planet.userData.speed = p.speed;
      planet.userData.name = p.name;
      
      // Etiqueta con nombre
      const labelGeo = new THREE.PlaneGeometry(p.name.length * 0.4 + 1, 0.5);
      const labelMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.9
      });
      // Nota: en una implementación completa usaríamos un font loader
      // Por ahora, un rectángulo etiqueta
      const label = new THREE.Mesh(labelGeo, labelMat);
      label.position.copy(planet.position);
      label.position.y = p.size + 0.3;
      label.rotation.x = -Math.PI / 2;
      label.userData.planeDist = p.distance;
      
      scene.add(planet);
      planets.push({ mesh: planet, label: label, data: p });
    }
    
    // ===== SOL EN CENTRO =====
    const solGeometry = new THREE.SphereGeometry(1.5, 64, 64);
    const solMaterial = new THREE.MeshStandardMaterial({ 
      color: 0xffa500,
      emissive: 0xff4500,
      emissiveIntensity: 0.4
    });
    const sol = new THREE.Mesh(solGeometry, solMaterial);
    sol.position.set(0, 0, 0);
    scene.add(sol);
    
    // Anillos pequeños alrededor del Sol (representando actividad)
    const ringGeo = new THREE.TorusGeometry(1.6, 0.1, 8, 32);
    const ringMat = new THREE.MeshBasicMaterial({ 
      color: 0xffd700,
      transparent: true,
      opacity: 0.2
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);
    
    // ===== ANIMATION: Órbitas y rotación =====
    let planetProgress = 0;
    
    window.updateScene = function(timeInSeconds) {
      // Rotar el Sol
      sol.rotation.y += 0.01;
      sol.rotation.x += 0.005;
      ring.rotation.y += 0.005;
      
      // Mover planetas en sus órbitas
      for (let i = 0; i < planets.length; i++) {
        const p = planets[i];
        const angle = timeInSeconds * p.data.speed;
        const x = Math.cos(angle) * p.data.distance;
        const z = Math.sin(angle) * p.data.distance;
        p.mesh.position.set(x, 0, z);
        
        // Hacer parpadear un poco la etiqueta
        p.label.position.x = p.mesh.position.x;
        p.label.position.z = p.mesh.position.z;
        p.label.opacity = 0.8 + 0.2 * Math.sin(timeInSeconds * 0.5);
      }
      
      // Rotar anillos internos
      innerOrbit.rotation.z += 0.005;
      
      // Progresso general
      const progress = timeInSeconds / 90;
      
      return {
        globalTime: timeInSeconds,
        active: true,
        scene: "planetas",
        localTime: timeInSeconds % 28,
        progress: progress
      };
    };
    
    // Loop de animación
    let planetFrame = 0;
    function animate() {
      requestAnimationFrame(animate);
      
      const sceneState = window.updateScene(planetFrame);
      
      renderer.render(scene, camera);
      
      planetFrame = (planetFrame + 1) % 2700;
    }
    animate();
  </script>
</body>
</html>
