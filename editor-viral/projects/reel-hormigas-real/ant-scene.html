<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ant Scene Renderer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Configuración
        const CONFIG = {
            width: 1080,
            height: 1920,
            fps: 30,
            duration: 80, // segundos
            models: [
                { name: 'ant-queen-base', url: 'assets/models/polyfork/ant-queen-base.glb', scale: 1.5, pos: [0, 0, 0], anim: 'idle' },
                { name: 'wood-ant-base', url: 'assets/models/polyfork/wood-ant-base.glb', scale: 1.2, pos: [-2, 0, -3], anim: 'walk' },
                { name: 'honeybee-base', url: 'assets/models/polyfork/honeybee-base.glb', scale: 0.8, pos: [3, 2, -2], anim: 'fly' },
                { name: 'common-wasp-base', url: 'assets/models/polyfork/common-wasp-base.glb', scale: 0.8, pos: [-3, 1.5, 2], anim: 'fly' },
                { name: 'praying-mantis-base', url: 'assets/models/polyfork/praying-mantis-base.glb', scale: 1.5, pos: [0, 0, 4], anim: 'idle' },
                { name: 'stag-beetle-base', url: 'assets/models/polyfork/stag-beetle-base.glb', scale: 1.3, pos: [2, 0, -4], anim: 'walk' },
                { name: 'tarantula-base', url: 'assets/models/polyfork/tarantula-base.glb', scale: 1.4, pos: [-1, 0, 3], anim: 'idle' },
                { name: 'green-aphid-base', url: 'assets/models/polyfork/green-aphid-base.glb', scale: 0.5, pos: [1, 0.2, -1], anim: 'idle' },
                { name: 'seven-spot-ladybird-base', url: 'assets/models/polyfork/seven-spot-ladybird-base.glb', scale: 0.6, pos: [-2, 0.2, 1], anim: 'walk' },
                { name: 'stone-centipede-base', url: 'assets/models/polyfork/stone-centipede-base.glb', scale: 1.0, pos: [0, 0.2, -2], anim: 'crawl' },
            ]
        };

        // Renderer
        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(CONFIG.width, CONFIG.height);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setClearColor(0x0a0a1a, 1);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // Scene
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.008);

        // Camera
        const camera = new THREE.PerspectiveCamera(40, CONFIG.width / CONFIG.height, 0.1, 200);
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 0, 0);

        // Controls (for preview only)
        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 50;

        // Lighting
        const ambient = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xffffee, 2.5);
        sun.position.set(20, 40, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -30;
        sun.shadow.camera.right = 30;
        sun.shadow.camera.top = 30;
        sun.shadow.camera.bottom = -30;
        sun.shadow.bias = -0.001;
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0x88aaff, 0.8);
        fill.position.set(-15, 10, -15);
        scene.add(fill);

        const rim = new THREE.DirectionalLight(0xffddaa, 0.5);
        rim.position.set(0, -10, -20);
        scene.add(rim);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(100, 100, 50, 50);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a2e, 
            roughness: 0.9, 
            metalness: 0.1,
            vertexColors: true
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Add some grass/detail
        const detailGeo = new THREE.PlaneGeometry(2, 2);
        const detailMat = new THREE.MeshStandardMaterial({ 
            color: 0x2d4a2d, 
            transparent: true, 
            opacity: 0.6,
            side: THREE.DoubleSide,
            alphaTest: 0.5
        });
        for (let i = 0; i < 200; i++) {
            const grass = new THREE.Mesh(detailGeo, detailMat);
            grass.position.set(
                (Math.random() - 0.5) * 80,
                0.02,
                (Math.random() - 0.5) * 80
            );
            grass.rotation.x = -Math.PI / 2;
            grass.rotation.z = Math.random() * Math.PI * 2;
            grass.scale.setScalar(0.3 + Math.random() * 0.5);
            scene.add(grass);
        }

        // Load models
        const loader = new GLTFLoader();
        const models = new Map();
        const mixers = [];

        async function loadModels() {
            for (const m of CONFIG.models) {
                try {
                    const gltf = await loader.loadAsync(m.url);
                    const model = gltf.scene;
                    model.scale.setScalar(m.scale);
                    model.position.set(...m.pos);
                    model.castShadow = true;
                    model.receiveShadow = true;
                    
                    // Traverse and enable shadows
                    model.traverse(child => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                child.material.metalness = 0.1;
                                child.material.roughness = 0.7;
                            }
                        }
                    });

                    // Animations
                    if (gltf.animations && gltf.animations.length > 0) {
                        const mixer = new THREE.AnimationMixer(model);
                        mixers.push(mixer);
                        gltf.animations.forEach(clip => {
                            const action = mixer.clipAction(clip);
                            action.play();
                        });
                    } else {
                        // Create procedural animation based on type
                        createProceduralAnimation(model, m.anim);
                    }

                    scene.add(model);
                    models.set(m.name, { model, animType: m.anim });
                    console.log(`Loaded: ${m.name}`);
                } catch (e) {
                    console.error(`Failed to load ${m.name}:`, e);
                }
            }
            console.log(`Loaded ${models.size} models`);
        }

        function createProceduralAnimation(model, type) {
            const startPos = model.position.clone();
            const startRot = model.rotation.clone();
            
            model.userData.anim = { 
                type, 
                startPos, 
                startRot,
                phase: Math.random() * Math.PI * 2,
                speed: 0.5 + Math.random() * 0.5
            };
        }

        function updateProceduralAnimations(delta) {
            models.forEach(({ model, animType }) => {
                if (!model.userData.anim) return;
                const anim = model.userData.anim;
                const t = performance.now() * 0.001 * anim.speed + anim.phase;
                
                switch (anim.type) {
                    case 'walk':
                        model.position.x = anim.startPos.x + Math.sin(t) * 1.5;
                        model.position.z = anim.startPos.z + Math.cos(t * 0.7) * 1.5;
                        model.rotation.y = Math.sin(t) * 0.3;
                        break;
                    case 'fly':
                        model.position.y = anim.startPos.y + Math.sin(t * 1.5) * 1.0;
                        model.position.x = anim.startPos.x + Math.sin(t * 0.8) * 2.0;
                        model.position.z = anim.startPos.z + Math.cos(t * 0.6) * 2.0;
                        model.rotation.y = Math.sin(t) * 0.5;
                        break;
                    case 'crawl':
                        model.position.x = anim.startPos.x + Math.sin(t * 0.8) * 1.0;
                        model.position.z = anim.startPos.z + Math.cos(t * 0.5) * 1.0;
                        model.rotation.y = Math.sin(t * 0.5) * 0.2;
                        break;
                    case 'idle':
                        model.position.y = anim.startPos.y + Math.sin(t * 2) * 0.15;
                        model.rotation.y = anim.startRot.y + Math.sin(t * 0.5) * 0.15;
                        break;
                }
            });
        }

        // Camera animation
        const cameraPath = [
            { pos: [0, 8, 18], target: [0, 0, 0], fov: 40, duration: 10 },
            { pos: [5, 6, 12], target: [-2, 0, -3], fov: 35, duration: 8 },
            { pos: [-3, 5, 10], target: [3, 2, -2], fov: 30, duration: 8 },
            { pos: [2, 7, 15], target: [0, 0, 4], fov: 40, duration: 8 },
            { pos: [-5, 8, 14], target: [2, 0, -4], fov: 35, duration: 8 },
            { pos: [0, 10, 20], target: [0, 0, 0], fov: 45, duration: 10 },
            { pos: [8, 6, 8], target: [-1, 0, 3], fov: 30, duration: 8 },
            { pos: [-2, 5, 12], target: [1, 0.2, -1], fov: 28, duration: 8 },
            { pos: [3, 7, 16], target: [0, 0, -2], fov: 38, duration: 8 },
            { pos: [0, 12, 25], target: [0, 0, 0], fov: 50, duration: 14 },
        ];

        function updateCamera(t) {
            let elapsed = 0;
            for (let i = 0; i < cameraPath.length; i++) {
                const seg = cameraPath[i];
                if (t < elapsed + seg.duration) {
                    const localT = (t - elapsed) / seg.duration;
                    const eased = easeInOutCubic(localT);
                    
                    if (i === 0) {
                        camera.position.lerp(new THREE.Vector3(...seg.pos), eased * 0.02);
                        camera.fov = THREE.MathUtils.lerp(camera.fov, seg.fov, eased * 0.02);
                    } else {
                        const prev = cameraPath[i - 1];
                        const pos = new THREE.Vector3(...seg.pos);
                        const prevPos = new THREE.Vector3(...prev.pos);
                        camera.position.lerpVectors(prevPos, pos, eased);
                        
                        const target = new THREE.Vector3(...seg.target);
                        const prevTarget = new THREE.Vector3(...prev.target);
                        const lookTarget = new THREE.Vector3().lerpVectors(prevTarget, target, eased);
                        camera.lookAt(lookTarget);
                        
                        camera.fov = THREE.MathUtils.lerp(prev.fov, seg.fov, eased);
                    }
                    camera.updateProjectionMatrix();
                    break;
                }
                elapsed += seg.duration;
            }
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // Particles
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 500;
        const positions = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 60;
            positions[i * 3 + 1] = Math.random() * 30;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 60;
            sizes[i] = Math.random() * 2 + 0.5;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        
        const particleMat = new THREE.PointsMaterial({
            color: 0xffffee,
            size: 1,
            transparent: true,
            opacity: 0.4,
            sizeAttenuation: true
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Clock
        const clock = new THREE.Clock();

        // Render loop
        let frame = 0;
        const totalFrames = CONFIG.duration * CONFIG.fps;
        
        function animate() {
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // Update procedural animations
            updateProceduralAnimations(delta);

            // Update camera
            updateCamera(elapsed);

            // Update mixers
            mixers.forEach(mixer => mixer.update(delta));

            // Rotate particles slowly
            particles.rotation.y += delta * 0.01;

            // Update controls
            controls.update();

            renderer.render(scene, camera);
            frame++;

            if (frame < totalFrames) {
                requestAnimationFrame(animate);
            } else {
                console.log('Render complete');
            }
        }

        // Expose for capture
        window.renderFrame = (frameNum) => {
            const targetTime = frameNum / CONFIG.fps;
            // This would need a more sophisticated time control
            // For now, just render current frame
        };

        window.getScene = () => scene;
        window.getCamera = () => camera;
        window.getRenderer = () => renderer;

        (async () => {
            await loadModels();
            animate();
        })();
    </script>
</body>
</html>
